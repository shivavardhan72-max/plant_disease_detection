{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto;" class="card">
    <div class="card-header text-center">
        <h2 class="card-title" style="justify-content: center;">Register</h2>
        <p class="card-desc">Create your FloraScan AI account</p>
    </div>
    <form method="POST" action="{{ url_for('register') }}" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.3rem; display: block;">Full Name</label>
            <input type="text" name="name" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); padding: 0.75rem; border-radius: var(--radius-sm); color: #fff;">
        </div>
        <div>
            <label style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.3rem; display: block;">Email</label>
            <input type="email" name="email" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); padding: 0.75rem; border-radius: var(--radius-sm); color: #fff;">
        </div>
        <div>
            <label style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.3rem; display: block;">Password</label>
            <input type="password" name="password" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); padding: 0.75rem; border-radius: var(--radius-sm); color: #fff;">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Create Account</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <span style="color: var(--text-secondary);">Already have an account?</span> 
        <a href="{{ url_for('login') }}" style="color: var(--emerald-400); text-decoration: none;">Sign in</a>
    </div>
</div>
{% endblock %}
